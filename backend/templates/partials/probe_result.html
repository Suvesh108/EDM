<!-- Probe Result Partial -->
<div class="p-3 bg-[#18181b] rounded-xl border border-white/[0.08] space-y-3">
  <!-- Classification & Media Summary -->
  <div class="flex items-start space-x-3">
    {% if metadata.thumbnail %}
    <img src="{{ metadata.thumbnail }}" alt="Thumbnail" class="w-16 h-12 object-cover rounded-lg border border-white/[0.08] shrink-0" onerror="this.style.display='none'"/>
    {% endif %}
    <div class="min-w-0 flex-1">
      <div class="flex items-center space-x-2">
        <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-[#3ea6ff]/20 text-[#3ea6ff] border border-[#3ea6ff]/30">
          [{{ pack_name or 'HttpPack' }}]
        </span>
        <span class="text-xs text-gray-400 truncate">{{ metadata.creator or 'Direct Link' }}</span>
      </div>
      <h4 class="font-hanken font-bold text-xs text-white truncate mt-0.5">{{ metadata.title }}</h4>
    </div>
  </div>

  <!-- Format Selector Chips -->
  <div class="space-y-1.5">
    <label class="block text-[11px] font-mono text-gray-400">Select Format / Quality</label>
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
      {% for f in metadata.formats %}
      <div
        class="format-chip p-2 rounded-xl border {% if loop.first or f.resolution == '1080p FHD' %}border-[#3ea6ff] bg-[#3ea6ff]/15 text-white{% else %}border-white/[0.08] text-gray-300{% endif %} hover:border-[#3ea6ff]/60 hover:bg-white/[0.04] transition-all cursor-pointer flex flex-col justify-between"
        onclick="selectFormat(this, '{{ f.id }}', '{{ f.resolution }}', '{{ metadata.category or 'VIDEO' }}', '{{ f.format|lower }}', '{{ f.directUrl or '' }}')"
      >
        <div class="font-bold text-[11px] font-mono flex items-center justify-between">
          <span>{{ f.resolution }}</span>
          <span class="text-[9px] px-1 rounded bg-black/40 text-gray-400">{{ f.format }}</span>
        </div>
        <div class="text-[10px] text-gray-400 mt-1 flex items-center justify-between">
          <span>{{ f.size }}</span>
          <span class="text-sky-400">{{ f.bitrate }}</span>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</div>

<script>
  // Pre-select first format
  const titleInput = document.getElementById('selected-title');
  if (titleInput) {
    titleInput.value = {{ (metadata.title or '')|tojson }};
  }
  {% if metadata.formats and metadata.formats|length > 0 %}
    document.getElementById('selected-format-id').value = "{{ metadata.formats[0].id }}";
    document.getElementById('selected-resolution').value = "{{ metadata.formats[0].resolution }}";
    document.getElementById('selected-category').value = "{{ 'DIRECT' if metadata.formats[0].directUrl else (metadata.category or 'VIDEO') }}";
    document.getElementById('selected-extension').value = "{{ metadata.formats[0].format|lower }}";
    {% if metadata.formats[0].directUrl %}
      const initialTaskUrl = document.getElementById('task-url-input');
      if (initialTaskUrl) initialTaskUrl.value = "{{ metadata.formats[0].directUrl }}";
    {% endif %}
  {% endif %}
</script>
