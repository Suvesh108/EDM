<!-- BitTorrent & Magnet Swarm Modal -->
<div id="torrent-modal" class="vortex-modal fixed inset-0 z-50 hidden items-center justify-center bg-black/80 backdrop-blur-md p-4">
  <div class="relative w-full max-w-2xl rounded-2xl bg-[#1f1f23] border border-cyan-500/30 shadow-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
    <!-- Header -->
    <div class="flex items-center justify-between pb-3 border-b border-white/[0.08]">
      <div class="flex items-center space-x-2.5">
        <div class="w-8 h-8 rounded-xl bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 flex items-center justify-center shadow-md shadow-cyan-500/10">
          <svg class="w-4.5 h-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="2"></circle><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"></path></svg>
        </div>
        <div>
          <h3 class="font-hanken font-bold text-sm text-white flex items-center space-x-2">
            <span>BitTorrent & DHT Swarm Manager</span>
            <span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 font-semibold">PEER-TO-PEER</span>
          </h3>
          <p class="text-[11px] font-mono text-gray-400">High-concurrency DHT peer discovery with automatic live public tracker injection</p>
        </div>
      </div>
      <button onclick="closeModal('torrent-modal')" class="p-1 rounded-lg text-gray-400 hover:text-white hover:bg-white/[0.06] transition-colors cursor-pointer">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <!-- Magnet Ingestion Bar -->
    <div class="space-y-1.5">
      <label class="block text-xs font-mono text-gray-300">Add Magnet URI or InfoHash</label>
      <div class="flex space-x-2">
        <input
          type="text"
          id="magnet-input"
          placeholder="magnet:?xt=urn:btih:... or 40-character hex hash"
          class="flex-1 bg-[#161618] border border-white/[0.08] focus:border-cyan-400 rounded-xl px-3.5 py-2 text-xs font-mono text-white placeholder-gray-500 focus:outline-none"
        />
        <button
          type="button"
          onclick="addMagnetToSwarm()"
          class="px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-black font-bold text-xs font-sans transition-colors cursor-pointer shadow-md shadow-cyan-500/20 flex items-center space-x-1.5"
        >
          <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          <span>Ingest Swarm</span>
        </button>
      </div>
    </div>

    <!-- Active Swarms Table Container (Live HTMX poller) -->
    <div class="space-y-2">
      <div class="flex items-center justify-between text-[11px] font-mono text-gray-400">
        <span class="font-bold uppercase tracking-wider">Active Swarms & Torrent Tasks</span>
        <button onclick="refreshTorrentList()" class="hover:text-cyan-300 transition-colors cursor-pointer flex items-center space-x-1">
          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
          <span>Refresh</span>
        </button>
      </div>

      <div
        id="torrent-list-container"
        hx-get="/partials/torrent/list"
        hx-trigger="load, every 2s"
        class="space-y-2"
      >
        <!-- Injected via partial -->
        <div class="text-center py-6 text-xs text-gray-500 font-mono">Loading active swarms...</div>
      </div>
    </div>
  </div>
</div>

<script>
  function addMagnetToSwarm() {
    const input = document.getElementById('magnet-input');
    const magnet = input ? input.value.trim() : '';
    if (!magnet) {
      showToast("Please enter a magnet link or hash", 'error');
      return;
    }

    fetch('/api/torrent/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ magnetURI: magnet })
    })
    .then(r => r.json())
    .then(data => {
      input.value = '';
      showToast(`Swarm registered: ${data.name || 'Torrent'}`, 'success');
      refreshTorrentList();
    })
    .catch(() => showToast("Failed to register torrent", 'error'));
  }

  function refreshTorrentList() {
    const container = document.getElementById('torrent-list-container');
    if (container) {
      htmx.trigger(container, 'load');
    }
  }

  function removeTorrent(hash) {
    fetch(`/api/torrent/${hash}?deleteFiles=true`, { method: 'DELETE' })
      .then(() => {
        showToast("Swarm removed", 'info');
        refreshTorrentList();
      })
      .catch(() => showToast("Could not remove swarm", 'error'));
  }
</script>
