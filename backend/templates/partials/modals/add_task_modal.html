<!-- Add Task Modal -->
<div id="add-task-modal" class="vortex-modal fixed inset-0 z-50 hidden items-center justify-center bg-black/75 backdrop-blur-md p-4">
  <div class="relative w-full max-w-xl rounded-2xl bg-[#202023] border border-white/[0.08] shadow-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
    <!-- Header -->
    <div class="flex items-center justify-between pb-3 border-b border-white/[0.08]">
      <div class="flex items-center space-x-2">
        <div class="w-7 h-7 rounded-lg bg-sky-500/20 text-[#3ea6ff] flex items-center justify-center">
          <svg class="w-4 h-4 stroke-[2.2]" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </div>
        <h3 class="font-hanken font-bold text-sm text-white">Add Download Task</h3>
      </div>
      <button onclick="closeModal('add-task-modal')" class="p-1 rounded-lg text-gray-400 hover:text-white hover:bg-white/[0.06] transition-colors cursor-pointer">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <!-- Form -->
    <form
      id="add-task-form"
      hx-post="/api/tasks/create"
      hx-target="#tasks-list-container"
      hx-swap="innerHTML"
      onsubmit="closeModal('add-task-modal'); showToast('Task queued!', 'success');"
      class="space-y-4"
    >
      <!-- Hidden selection inputs -->
      <input type="hidden" id="selected-title" name="title" value="" />
      <input type="hidden" id="selected-format-id" name="format_id" value="best" />
      <input type="hidden" id="selected-resolution" name="resolution" value="1080p FHD" />
      <input type="hidden" id="selected-category" name="category" value="VIDEO" />
      <input type="hidden" id="selected-extension" name="target_extension" value="mp4" />

      <!-- URL Input Area -->
      <div class="space-y-1.5">
        <label class="block text-xs font-mono text-gray-300">Download URL / Stream Link</label>
        <textarea
          id="task-url-input"
          name="url"
          rows="2"
          required
          placeholder="Paste YouTube, TikTok, TeraBox, Direct HTTP/S, HLS .m3u8, or magnet:? link"
          hx-post="/api/probe"
          hx-trigger="input changed delay:400ms, paste"
          hx-target="#probe-result-container"
          class="w-full bg-[#18181b] border border-white/[0.08] focus:border-[#3ea6ff] rounded-xl p-3 text-xs font-mono text-white placeholder-gray-500 transition-colors focus:outline-none"
        ></textarea>
      </div>

      <!-- Live Probe Result Container -->
      <div id="probe-result-container" class="space-y-3">
        <!-- Live format chips and metadata will be populated here by /api/probe -->
      </div>

      <!-- Turbo Pipes Connections Slider -->
      <div class="space-y-1.5 bg-[#18181b] p-3 rounded-xl border border-white/[0.06]">
        <div class="flex items-center justify-between text-xs">
          <span class="text-gray-300 font-medium">Turbo Parallel Connections (IDM Slices)</span>
          <span id="thread-count-badge" class="font-mono text-[#3ea6ff] font-bold">16 Pipes</span>
        </div>
        <div class="flex items-center space-x-3 pt-1">
          <span class="text-[10px] font-mono text-gray-500">1</span>
          <input
            type="range"
            name="threads"
            min="1"
            max="32"
            value="16"
            oninput="document.getElementById('thread-count-badge').innerText = this.value + ' Pipes'"
            class="flex-1 accent-[#3ea6ff] h-1.5 bg-gray-700 rounded-lg cursor-pointer"
          />
          <span class="text-[10px] font-mono text-gray-500">32</span>
        </div>
      </div>

      <!-- Destination & Conflict Policy -->
      <div class="grid grid-cols-2 gap-3">
        <div class="space-y-1">
          <label class="block text-xs font-mono text-gray-400">Save Destination</label>
          <input
            type="text"
            name="destination"
            value="Downloads/Vortex"
            class="w-full bg-[#18181b] border border-white/[0.08] rounded-xl px-3 py-1.5 text-xs font-mono text-gray-300 focus:outline-none"
          />
        </div>
        <div class="space-y-1">
          <label class="block text-xs font-mono text-gray-400">Filename Conflict</label>
          <select
            name="conflict_policy"
            class="w-full bg-[#18181b] border border-white/[0.08] rounded-xl px-3 py-1.5 text-xs text-gray-300 focus:outline-none"
          >
            <option value="rename" selected>Auto-Rename (keep both)</option>
            <option value="overwrite">Overwrite existing</option>
            <option value="skip">Skip download</option>
          </select>
        </div>
      </div>

      <!-- Footer Buttons -->
      <div class="flex items-center justify-end space-x-2 pt-2 border-t border-white/[0.08]">
        <button
          type="button"
          onclick="closeModal('add-task-modal')"
          class="px-4 py-1.5 rounded-xl bg-[#2b2b2e] hover:bg-[#343438] text-gray-300 text-xs font-sans font-medium transition-colors cursor-pointer"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="px-5 py-1.5 rounded-xl bg-[#3ea6ff] hover:bg-[#3192e4] text-black text-xs font-sans font-bold transition-colors cursor-pointer shadow-md shadow-[#3ea6ff]/20 flex items-center space-x-1.5"
        >
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          <span>Start Download</span>
        </button>
      </div>
    </form>
  </div>
</div>
