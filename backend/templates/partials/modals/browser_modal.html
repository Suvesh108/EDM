<!-- Web Browser & Media Stream Sniffer Modal -->
<div id="browser-modal" class="vortex-modal fixed inset-0 z-50 hidden items-center justify-center bg-black/80 backdrop-blur-md p-4">
  <div class="relative w-full max-w-2xl rounded-2xl bg-[#1f1f23] border border-emerald-500/30 shadow-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
    <!-- Header -->
    <div class="flex items-center justify-between pb-3 border-b border-white/[0.08]">
      <div class="flex items-center space-x-2.5">
        <div class="w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center shadow-md shadow-emerald-500/10">
          <svg class="w-4.5 h-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
        </div>
        <div>
          <h3 class="font-hanken font-bold text-sm text-white flex items-center space-x-2">
            <span>Inbuilt Browser & Sniffer</span>
            <span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 font-semibold">STREAM EXTRACTOR</span>
          </h3>
          <p class="text-[11px] font-mono text-gray-400">Browse web pages, sniff direct video streams, or query search engines</p>
        </div>
      </div>
      <button onclick="closeModal('browser-modal')" class="p-1 rounded-lg text-gray-400 hover:text-white hover:bg-white/[0.06] transition-colors cursor-pointer">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <!-- Quick Portals Grid -->
    <div class="space-y-2">
      <label class="block text-[11px] font-mono text-gray-400 font-bold uppercase tracking-wider">Quick Portals</label>
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
        <button
          onclick="setBrowserTarget('https://www.youtube.com')"
          class="flex items-center justify-between p-2.5 rounded-xl bg-[#161618] hover:bg-[#252528] border border-white/[0.06] hover:border-red-500/40 transition-colors text-left group cursor-pointer"
        >
          <div class="flex items-center space-x-2">
            <span class="w-2 h-2 rounded-full bg-red-500"></span>
            <span class="text-xs font-sans font-medium text-white group-hover:text-red-400 transition-colors">YouTube</span>
          </div>
          <span class="text-[9px] font-mono px-1.5 py-0.5 rounded bg-white/[0.04] text-gray-400">Media</span>
        </button>

        <button
          onclick="setBrowserTarget('https://www.terabox.com')"
          class="flex items-center justify-between p-2.5 rounded-xl bg-[#161618] hover:bg-[#252528] border border-white/[0.06] hover:border-sky-500/40 transition-colors text-left group cursor-pointer"
        >
          <div class="flex items-center space-x-2">
            <span class="w-2 h-2 rounded-full bg-sky-400"></span>
            <span class="text-xs font-sans font-medium text-white group-hover:text-sky-300 transition-colors">TeraBox</span>
          </div>
          <span class="text-[9px] font-mono px-1.5 py-0.5 rounded bg-white/[0.04] text-gray-400">Cloud</span>
        </button>

        <button
          onclick="setBrowserTarget('https://rou.video')"
          class="flex items-center justify-between p-2.5 rounded-xl bg-[#161618] hover:bg-[#252528] border border-white/[0.06] hover:border-purple-500/40 transition-colors text-left group cursor-pointer"
        >
          <div class="flex items-center space-x-2">
            <span class="w-2 h-2 rounded-full bg-purple-400"></span>
            <span class="text-xs font-sans font-medium text-white group-hover:text-purple-300 transition-colors">rou.video</span>
          </div>
          <span class="text-[9px] font-mono px-1.5 py-0.5 rounded bg-white/[0.04] text-gray-400">Aggregator</span>
        </button>

        <button
          onclick="setBrowserTarget('https://diskwala.com')"
          class="flex items-center justify-between p-2.5 rounded-xl bg-[#161618] hover:bg-[#252528] border border-white/[0.06] hover:border-amber-500/40 transition-colors text-left group cursor-pointer"
        >
          <div class="flex items-center space-x-2">
            <span class="w-2 h-2 rounded-full bg-amber-400"></span>
            <span class="text-xs font-sans font-medium text-white group-hover:text-amber-300 transition-colors">DiskWala</span>
          </div>
          <span class="text-[9px] font-mono px-1.5 py-0.5 rounded bg-white/[0.04] text-gray-400">Storage</span>
        </button>

        <button
          onclick="setBrowserTarget('https://doodstream.com')"
          class="flex items-center justify-between p-2.5 rounded-xl bg-[#161618] hover:bg-[#252528] border border-white/[0.06] hover:border-emerald-500/40 transition-colors text-left group cursor-pointer"
        >
          <div class="flex items-center space-x-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
            <span class="text-xs font-sans font-medium text-white group-hover:text-emerald-300 transition-colors">DoodStream</span>
          </div>
          <span class="text-[9px] font-mono px-1.5 py-0.5 rounded bg-white/[0.04] text-gray-400">Stream</span>
        </button>

        <button
          onclick="setBrowserTarget('https://www.google.com')"
          class="flex items-center justify-between p-2.5 rounded-xl bg-[#161618] hover:bg-[#252528] border border-white/[0.06] hover:border-blue-500/40 transition-colors text-left group cursor-pointer"
        >
          <div class="flex items-center space-x-2">
            <span class="w-2 h-2 rounded-full bg-blue-400"></span>
            <span class="text-xs font-sans font-medium text-white group-hover:text-blue-300 transition-colors">Google</span>
          </div>
          <span class="text-[9px] font-mono px-1.5 py-0.5 rounded bg-white/[0.04] text-gray-400">Search</span>
        </button>
      </div>
    </div>

    <!-- Search / Address Bar -->
    <div class="space-y-2">
      <div class="flex items-center justify-between">
        <label class="block text-xs font-mono text-gray-300">Web Address or Search Query</label>
        <!-- Search Engine Selector -->
        <div class="flex items-center space-x-1 bg-[#141416] p-0.5 rounded-lg border border-white/[0.06] text-[10px] font-mono">
          <button id="engine-google" onclick="setSearchEngine('google')" class="px-2 py-0.5 rounded bg-[#38383c] text-white">Google</button>
          <button id="engine-duckduckgo" onclick="setSearchEngine('duckduckgo')" class="px-2 py-0.5 rounded text-gray-400 hover:text-white">DuckDuckGo</button>
          <button id="engine-bing" onclick="setSearchEngine('bing')" class="px-2 py-0.5 rounded text-gray-400 hover:text-white">Bing</button>
        </div>
      </div>

      <div class="relative">
        <input
          type="text"
          id="browser-url-input"
          placeholder="Enter URL (https://...) or keywords to search..."
          class="w-full bg-[#161618] border border-white/[0.08] focus:border-emerald-500 rounded-xl px-3.5 py-2.5 text-xs font-mono text-white placeholder-gray-500 focus:outline-none"
        />
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex flex-col sm:flex-row items-center justify-between gap-3 pt-3 border-t border-white/[0.08]">
      <div class="text-[11px] font-mono text-gray-400 flex items-center space-x-1.5">
        <svg class="w-3.5 h-3.5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        <span>Auto-intercepts video streams and sends to IDM queue</span>
      </div>

      <div class="flex items-center space-x-2">
        <button
          onclick="openTargetInSystemBrowser()"
          class="px-3.5 py-1.5 rounded-xl bg-[#28282c] hover:bg-[#34343a] text-gray-300 hover:text-white border border-white/[0.08] text-xs font-sans font-medium transition-colors cursor-pointer flex items-center space-x-1.5"
        >
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
          <span>Open External</span>
        </button>

        <button
          onclick="ingestBrowserUrlToDownloader()"
          class="px-4 py-1.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-black font-bold text-xs font-sans transition-colors cursor-pointer shadow-md shadow-emerald-500/20 flex items-center space-x-1.5"
        >
          <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          <span>Ingest to Downloader</span>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  let activeSearchEngine = 'google';

  function setSearchEngine(engine) {
    activeSearchEngine = engine;
    ['google', 'duckduckgo', 'bing'].forEach(e => {
      const btn = document.getElementById(`engine-${e}`);
      if (btn) {
        if (e === engine) {
          btn.className = "px-2 py-0.5 rounded bg-[#38383c] text-white";
        } else {
          btn.className = "px-2 py-0.5 rounded text-gray-400 hover:text-white";
        }
      }
    });
  }

  function setBrowserTarget(url) {
    const input = document.getElementById('browser-url-input');
    if (input) input.value = url;
  }

  function resolveBrowserUrl() {
    const input = document.getElementById('browser-url-input');
    const val = input ? input.value.trim() : '';
    if (!val) return 'https://www.google.com';

    if (/^https?:\/\//i.test(val) || /^[\w-]+\.[\w.-]+(\/.*)?$/i.test(val)) {
      return val.startsWith('http') ? val : `https://${val}`;
    }

    if (activeSearchEngine === 'duckduckgo') {
      return `https://duckduckgo.com/?q=${encodeURIComponent(val)}`;
    } else if (activeSearchEngine === 'bing') {
      return `https://www.bing.com/search?q=${encodeURIComponent(val)}`;
    } else {
      return `https://www.google.com/search?q=${encodeURIComponent(val)}`;
    }
  }

  function openTargetInSystemBrowser() {
    const target = resolveBrowserUrl();
    window.open(target, '_blank', 'noopener,noreferrer');
  }

  function ingestBrowserUrlToDownloader() {
    const target = resolveBrowserUrl();
    closeModal('browser-modal');
    openModal('add-task-modal');
    const taskInput = document.getElementById('task-url-input');
    if (taskInput) {
      taskInput.value = target;
      // Trigger probe
      htmx.trigger(taskInput, 'input');
    }
    showToast("URL sent to Vortex Downloader!", 'success');
  }
</script>
