{% if torrents and torrents|length > 0 %}
<div class="space-y-2">
  {% for t in torrents %}
  <div class="p-3 rounded-xl bg-[#161618] border border-white/[0.06] hover:border-cyan-500/30 transition-all space-y-2">
    <div class="flex items-center justify-between">
      <div class="min-w-0 flex items-center space-x-2">
        <svg class="w-4 h-4 text-cyan-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="2"></circle><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"></path></svg>
        <span class="text-xs font-sans font-medium text-white truncate max-w-sm" title="{{ t.name }}">{{ t.name }}</span>
      </div>
      <div class="flex items-center space-x-2">
        <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-cyan-500/10 text-cyan-300 border border-cyan-500/20">
          {{ t.numPeers }} Peers
        </span>
        <button
          onclick="removeTorrent('{{ t.infoHash }}')"
          class="p-1 rounded text-gray-500 hover:text-red-400 transition-colors cursor-pointer"
          title="Remove Torrent"
        >
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
    </div>

    <!-- Progress bar -->
    <div class="w-full bg-black/60 rounded-full h-1.5 overflow-hidden">
      <div class="bg-gradient-to-r from-cyan-500 to-emerald-400 h-full rounded-full transition-all" style="width: {{ t.progress }}%;"></div>
    </div>

    <!-- Metrics -->
    <div class="flex items-center justify-between text-[10px] font-mono text-gray-400">
      <span class="truncate max-w-xs text-gray-500 font-mono text-[9px]">{{ t.infoHash }}</span>
      <span class="text-emerald-400 font-bold">100% Ready</span>
    </div>
  </div>
  {% endfor %}
</div>
{% else %}
<div class="p-6 rounded-xl bg-[#161618] border border-dashed border-white/[0.08] text-center space-y-1">
  <div class="text-xs text-gray-400 font-sans">No active torrent swarms</div>
  <p class="text-[10px] font-mono text-gray-500">Paste any magnet URI above to start peer discovery</p>
</div>
{% endif %}
