name: CI

on:
  push:
    branches: [ main, "phase-*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

jobs:
  rust-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  frontend-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Desktop UI build
        run: |
          cd apps/desktop
          npm install
          npm run build
      - name: Extension build
        run: |
          cd extension
          npm install
          npm run build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust-check, frontend-check]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Desktop UI
        run: |
          cd apps/desktop
          npm install
          npm run build
      - name: Build Extension
        run: |
          cd extension
          npm install
          npm run build
      - name: Build NMH
        run: cargo build --release -p edm-nmh
      - name: Build Desktop App
        run: cargo build --release -p edm-desktop-app
      - name: Package Release
        shell: bash
        run: |
          mkdir -p release-dist
          cp target/release/edm-desktop-app.exe release-dist/
          tar -czvf release-dist/edm-extension.tar.gz -C extension/dist/chromium .
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edm-windows-x64
          path: release-dist/
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload ${{ github.ref_name }} release-dist/* --clobber || gh release create ${{ github.ref_name }} release-dist/* --title "EDM ${{ github.ref_name }}" --generate-notes
