name: CI

on:
  push:
    branches: [ main, "phase-*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

jobs:
  rust-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Ensure frontend dist exists for Tauri context
        shell: bash
        run: |
          mkdir -p apps/desktop/dist
          echo '<!doctype html><html><head><title>EDM</title></head><body><div id="root"></div></body></html>' > apps/desktop/dist/index.html
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Tests
        run: cargo test --workspace

  frontend-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Desktop UI build
        run: |
          cd apps/desktop
          npm install
          npm run build
      - name: Extension build
        run: |
          cd extension
          npm install
          npm run build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust-check, frontend-check]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute Unified Release Build Script
        shell: powershell
        run: |
          .\scripts\build-release.ps1
      - name: Package Release
        shell: bash
        run: |
          mkdir -p release-dist
          find target -type f -name "EDM_*_x64-setup.exe" -exec cp {} release-dist/ \;
          tar -czvf release-dist/edm-extension.tar.gz -C extension/dist/chromium .
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edm-windows-x64
          path: release-dist/
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload ${{ github.ref_name }} release-dist/* --clobber || gh release create ${{ github.ref_name }} release-dist/* --title "EDM ${{ github.ref_name }}" --generate-notes
