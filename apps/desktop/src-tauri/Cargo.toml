[package]
name = "edm-desktop-app"
version = "0.0.3"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["image-ico", "image-png", "tray-icon", "custom-protocol"] }
tauri-plugin-single-instance = "2.5.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
edm-core = { path = "../../../crates/edm-core" }
edm-store = { path = "../../../crates/edm-store" }
edm-ipc = { path = "../../../crates/edm-ipc" }
tokio = { version = "1.43", features = ["full"] }
reqwest.workspace = true
uuid.workspace = true
chrono.workspace = true
url.workspace = true
urlencoding = "2.1"
axum.workspace = true
tower-http.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
anyhow = "1.0"
subtle = "2.6"
tokio-tungstenite = "0.26"
open = "5.3"
tauri-plugin-autostart = "2.7.0"
