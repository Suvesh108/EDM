<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EDM Live Download Dashboard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-top">
      <div class="brand">
        <img src="logo.png" alt="EDM">
        <span>EDM</span>
        <span class="pro-badge">v0.0.3</span>
      </div>
      <div id="connectionPill" class="connection-indicator">
        <span id="connectionDot" class="status-dot dot-connecting"></span>
        <span id="connectionText">Connecting...</span>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <nav class="nav-tabs">
      <button class="tab-btn active" data-tab="tasks">
        <span>Tasks</span>
        <span id="tasksBadge" class="tab-badge">0</span>
      </button>
      <button class="tab-btn" data-tab="settings">
        <span>Settings</span>
      </button>
    </nav>
  </header>

  <!-- Main Dynamic View Container -->
  <main id="app" class="content-area">
    <!-- Populated dynamically by popup.js -->
  </main>

  <script src="popup.js"></script>
</body>
</html>
